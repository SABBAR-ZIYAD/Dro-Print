services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: droprint
      MYSQL_USER: droprint
      MYSQL_PASSWORD: ${DB_PASSWORD:-droprint_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    volumes:
      - catalog_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./DroPrintBackend
    restart: unless-stopped
    environment:
      APP_NAME: DroPrint
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:?Set APP_KEY in the root .env file}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: droprint
      DB_USERNAME: droprint
      DB_PASSWORD: ${DB_PASSWORD:-droprint_local}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@droprint.local}
      MAIL_FROM_NAME: DroPrint
      QUOTE_RECIPIENT: ${QUOTE_RECIPIENT:-contact@droprint.ma}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/app/public
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./DroPrintFront
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
volumes:
  catalog_data:
  uploads:
